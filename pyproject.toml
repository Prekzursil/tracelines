[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelines"
version = "0.2.0"
description = "Extract continuous street-level 'blue line' coverage (Google/Mapillary/KartaView) as GeoJSON — official car Street View only, never photospheres."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Prekzursil" }]
keywords = [
    "street-view", "streetlevel", "mapillary", "kartaview", "coverage",
    "geojson", "gis", "openstreetmap", "panorama", "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Base install is Google-capable out of the box (streetlevel needs no API key).
# mapbox-vector-tile is a BASE dependency (kept in the `mapillary` extra too for
# backwards compatibility): the strict offline test/coverage gate installs only
# the base set, and the Mapillary parse path must run there for real — decoding
# recorded vector tiles — instead of silently degrading to `_mvt is None`.
dependencies = [
    "shapely>=2.0",
    "networkx>=3.0",
    "aiohttp>=3.9",
    "streetlevel>=0.12,<0.13",
    "diskcache>=5.6",
    "mapbox-vector-tile>=2.0",
]

[project.optional-dependencies]
mapillary = ["mapbox-vector-tile>=2.0"]           # Mapillary sequence vector-tile decode
snap = ["osmnx>=1.9", "geopandas>=0.14", "pyproj>=3.6"]  # optional OSM road-snapping
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]    # self-hostable proxy backend
all = ["mapbox-vector-tile>=2.0", "osmnx>=1.9", "geopandas>=0.14", "pyproj>=3.6"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10",
    "mercantile>=1.2", "mapbox-vector-tile>=2.0",
    "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://prekzursil.github.io/tracelines/"
Documentation = "https://prekzursil.github.io/tracelines/docs/"
Repository = "https://github.com/Prekzursil/tracelines"
Issues = "https://github.com/Prekzursil/tracelines/issues"

[project.scripts]
tracelines = "tracelines.cli:main"

[tool.setuptools.packages.find]
include = ["tracelines*"]

[tool.setuptools.package-data]
tracelines = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "network: hits live external endpoints (Google/Mapillary/KartaView); skipped by default",
]
addopts = "-m 'not network' -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
branch = true
source = ["tracelines"]
omit = [
  # the self-hostable FastAPI proxy (`server` extra) — fastapi/uvicorn are
  # optional and not installed in the offline gate env, so the hermetic
  # suite cannot import it; it is exercised by its own deploy lane
  "tracelines/proxy.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
exclude_also = [
  # module entry guards: exercised by direct invocation, not by the suite
  "if __name__ == .__main__.:",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
# Scope = the installed package, EXACTLY matching ci.yml's `mypy tracelines`
# (the repo's declared typing surface). Tests and scripts are enforced by
# ruff lint+format and the 100% line+branch coverage gate instead.
include = ["tracelines"]
# tracelines/proxy.py is the self-hostable FastAPI backend (the `server`
# extra: fastapi/uvicorn are deliberately NOT base dependencies), so a
# lean-gate environment has nothing to resolve its imports against. It stays
# type-checked by mypy in CI and is exercised by its own deploy lane
# (render.yaml / spaces/Dockerfile).
# "**/build": generated setuptools artifacts (a stale duplicate of the
# package under build/lib) must never be scanned; the same code is checked
# at its real path.
exclude = ["**/build", "tracelines/proxy.py"]
# Mirror mypy's repo-wide `ignore_missing_imports = true` for OPTIONAL
# extras a lean environment deliberately does not install (geopandas, osmnx,
# mercantile): those imports are optional at runtime by design (function
# local try/except / test importorskip), so a resolution failure there is
# not a type error. Base dependencies (shapely/aiohttp/streetlevel/
# diskcache/mapbox-vector-tile) ARE installed and still fully resolved.
reportMissingImports = false
